<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="880" height="330" rx="12" fill="#ffffff"/>
  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="600" fill="#1b1b1b">Chaining modules: one module's output is the next one's parameter</text>

  <rect x="24" y="56" width="832" height="250" rx="12" fill="#f3f6fa" stroke="#9aa9bb"/>
  <text x="44" y="82" font-size="14" font-weight="600" fill="#44546a">main.bicep</text>

  <!-- plan -->
  <rect x="50" y="110" width="200" height="74" rx="8" fill="#e7f1fb" stroke="#0078d4" stroke-width="1.5"/>
  <text x="150" y="138" text-anchor="middle" font-size="14" font-weight="600" fill="#0b4a80">module plan</text>
  <text x="150" y="160" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#333">plan.bicep</text>

  <!-- kv -->
  <rect x="50" y="214" width="200" height="74" rx="8" fill="#e7f1fb" stroke="#0078d4" stroke-width="1.5"/>
  <text x="150" y="242" text-anchor="middle" font-size="14" font-weight="600" fill="#0b4a80">module kv</text>
  <text x="150" y="264" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#333">keyvault.bicep</text>

  <!-- app -->
  <rect x="340" y="110" width="200" height="74" rx="8" fill="#e7f1fb" stroke="#0078d4" stroke-width="1.5"/>
  <text x="440" y="138" text-anchor="middle" font-size="14" font-weight="600" fill="#0b4a80">module app</text>
  <text x="440" y="160" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#333">appservice.bicep</text>

  <!-- kvAccess -->
  <rect x="630" y="160" width="200" height="74" rx="8" fill="#e7f1fb" stroke="#0078d4" stroke-width="1.5"/>
  <text x="730" y="188" text-anchor="middle" font-size="14" font-weight="600" fill="#0b4a80">module kvAccess</text>
  <text x="730" y="210" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#333">kv-access.bicep</text>

  <!-- arrows -->
  <line x1="250" y1="147" x2="336" y2="147" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <text x="293" y="138" text-anchor="middle" font-size="11" font-family="Consolas, monospace" fill="#7a5300">planId</text>

  <path d="M540,147 C590,147 590,180 626,186" fill="none" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <text x="586" y="132" text-anchor="middle" font-size="11" font-family="Consolas, monospace" fill="#7a5300">principalId</text>

  <path d="M250,251 C430,251 520,215 626,208" fill="none" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <text x="440" y="262" text-anchor="middle" font-size="11" font-family="Consolas, monospace" fill="#7a5300">keyVaultName</text>

  <text x="440" y="96" text-anchor="middle" font-size="12" fill="#444">Each arrow is an implicit dependency: Bicep deploys the module on the left first.</text>
  <text x="730" y="268" text-anchor="middle" font-size="12" fill="#444">waits for both app and kv</text>
</svg>
