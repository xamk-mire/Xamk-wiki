  <line x1="220.0" y1="98.0" x2="220.0" y2="133.0" stroke="#1d3557" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="110.0" y="218.0" width="220" height="56" rx="10" fill="#1d3557"/>
  <text x="220.0" y="241.9" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="14" fill="#ffffff" font-weight="700">Käynnistä keitin,</text>
  <text x="220.0" y="259.9" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="14" fill="#ffffff" font-weight="700">odota kiehumista</text>
  <line x1="220.0" y1="183.0" x2="220.0" y2="218.0" stroke="#1d3557" stroke-width="2" marker-end="url(#arr)"/>
