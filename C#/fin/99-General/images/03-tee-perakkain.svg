  <line x1="220.0" y1="274.0" x2="220.0" y2="315.0" stroke="#1d3557" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="110.0" y="403.0" width="220" height="50" rx="10" fill="#1d3557"/>
  <text x="220.0" y="432.9" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="14" fill="#ffffff" font-weight="700">Kaada vesi, odota 3 min</text>
  <line x1="220.0" y1="365.0" x2="220.0" y2="403.0" stroke="#1d3557" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="110.0" y="491.0" width="220" height="50" rx="10" fill="#1d3557"/>
  <text x="220.0" y="520.9" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="14" fill="#ffffff" font-weight="700">Nosta pussi pois</text>
