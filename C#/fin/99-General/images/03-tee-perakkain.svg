  <rect x="145.0" y="584.0" width="150" height="40" rx="20.0" fill="#2a9d8f"/>
  <text x="220.0" y="608.9" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="14" fill="#ffffff" font-weight="700">LOPETUS</text>
  <line x1="220.0" y1="541.0" x2="220.0" y2="584.0" stroke="#1d3557" stroke-width="2" marker-end="url(#arr)"/>
  <text x="220.0" y="668.0" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#457b9d">Ei haarautumista — suora putki alusta loppuun.</text>
