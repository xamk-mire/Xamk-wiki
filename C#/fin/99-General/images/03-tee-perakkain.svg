<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="440" height="720" viewBox="0 0 440 720" role="img" aria-label="Peräkkäisyys: teen keittäminen">
  <rect width="440" height="720" fill="#f7f5f2"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d3557"/>
    </marker>
  </defs>

  <text x="24.0" y="32.0" text-anchor="start" font-family="Segoe UI, Calibri, sans-serif" font-size="18" fill="#1d3557" font-weight="700">Peräkkäisyys: teen keittäminen</text>
  <rect x="145.0" y="58.0" width="150" height="40" rx="20.0" fill="#2a9d8f"/>
  <text x="220.0" y="82.9" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="14" fill="#ffffff" font-weight="700">ALOITUS</text>
