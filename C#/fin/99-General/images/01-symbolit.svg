<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360" role="img" aria-label="Vuokaavion symbolit">
  <rect width="980" height="360" fill="#f7f5f2"/>
