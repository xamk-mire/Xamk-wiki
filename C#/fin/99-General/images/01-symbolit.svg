      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d3557"/>
    </marker>
  </defs>

  <text x="24.0" y="36.0" text-anchor="start" font-family="Segoe UI, Calibri, sans-serif" font-size="20" fill="#1d3557" font-weight="700">Vuokaavion symbolit</text>
  <rect x="14.0" y="58" width="168" height="270" rx="12" fill="#ffffff" stroke="#c9c4bc" stroke-width="1.5"/>
