  <text x="98.0" y="159.9" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="14" fill="#ffffff" font-weight="700">ALOITUS</text>
  <text x="98.0" y="236.0" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="15" fill="#1d3557" font-weight="700">Aloitus / lopetus</text>
  <text x="98.0" y="262.0" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="12" fill="#457b9d">Soikio.</text>
  <text x="98.0" y="282.0" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="12" fill="#457b9d">Ohjelman alku ja loppu.</text>
  <rect x="202.0" y="58" width="168" height="270" rx="12" fill="#ffffff" stroke="#c9c4bc" stroke-width="1.5"/>
  <rect x="222.0" y="131.0" width="128" height="48" rx="10" fill="#1d3557"/>
  <text x="286.0" y="159.9" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="14" fill="#ffffff" font-weight="700">luku = 1</text>
  <text x="286.0" y="236.0" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="15" fill="#1d3557" font-weight="700">Prosessi</text>
  <text x="286.0" y="262.0" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="12" fill="#457b9d">Suorakulmio.</text>
  <text x="286.0" y="282.0" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="12" fill="#457b9d">Toimenpide tai lasku.</text>
  <rect x="390.0" y="58" width="168" height="270" rx="12" fill="#ffffff" stroke="#c9c4bc" stroke-width="1.5"/>
  <polygon points="474.0,112.0 548.0,155.0 474.0,198.0 400.0,155.0" fill="#e9c46a" stroke="#9b2226" stroke-width="1.6"/>
  <text x="474.0" y="159.9" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="14" fill="#1d3557" font-weight="700">x &gt; 0 ?</text>
  <text x="474.0" y="236.0" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="15" fill="#1d3557" font-weight="700">Valinta</text>
  <text x="474.0" y="262.0" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="12" fill="#457b9d">Salmiakki.</text>
  <text x="474.0" y="282.0" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="12" fill="#457b9d">Kyllä/ei-kysymys.</text>
  <rect x="578.0" y="58" width="168" height="270" rx="12" fill="#ffffff" stroke="#c9c4bc" stroke-width="1.5"/>
  <polygon points="609.0,131.0 731.0,131.0 715.0,179.0 593.0,179.0" fill="#457b9d"/>
  <text x="662.0" y="159.9" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="14" fill="#ffffff" font-weight="700">KYSY luku</text>
  <text x="662.0" y="236.0" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="15" fill="#1d3557" font-weight="700">Syöte / tuloste</text>
  <text x="662.0" y="262.0" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="12" fill="#457b9d">Suunnikas.</text>
  <text x="662.0" y="282.0" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="12" fill="#457b9d">Luku tai tulostus.</text>
  <rect x="766.0" y="58" width="168" height="270" rx="12" fill="#ffffff" stroke="#c9c4bc" stroke-width="1.5"/>
  <line x1="808.0" y1="155.0" x2="892.0" y2="155.0" stroke="#1d3557" stroke-width="2" marker-end="url(#arr)"/>
  <text x="850.0" y="236.0" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="15" fill="#1d3557" font-weight="700">Nuoli</text>
  <text x="850.0" y="262.0" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="12" fill="#457b9d">Viiva.</text>
  <text x="850.0" y="282.0" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="12" fill="#457b9d">Mihin seuraavaksi.</text>
